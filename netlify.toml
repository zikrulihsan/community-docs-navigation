# React Router (Vite) — halaman publik di-prerender, sisanya SPA.
[build]
  publish = "build/client"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# URL dari situs lama
[[redirects]]
  from = "/code-of-conduct.html"
  to = "/code-of-conduct"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/admin/login"
  to = "/masuk?next=/admin"
  status = 301

# Halaman lama yang dihapus saat portal member diluncurkan
[[redirects]]
  from = "/events"
  to = "/agenda"
  status = 301

[[redirects]]
  from = "/events/*"
  to = "/agenda"
  status = 301

[[redirects]]
  from = "/dashboard"
  to = "/portal"
  status = 301

[[redirects]]
  from = "/dashboard/*"
  to = "/portal/profil"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/jobs"
  to = "/"
  status = 301

[[redirects]]
  from = "/videos"
  to = "/"
  status = 301

[[redirects]]
  from = "/mentorship"
  to = "/"
  status = 301

[[redirects]]
  from = "/mentorship/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/courses"
  to = "/"
  status = 301

[[redirects]]
  from = "/courses/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/u/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/terima-kasih"
  to = "/"
  status = 301

# Semua path tanpa file prerender (course, profil member, activity baru, dst.)
# dilayani app shell SPA. Netlify mendahulukan file yang ada, jadi ini hanya fallback.
[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Font, logo, dan bundle Vite (nama ber-hash) aman di-cache permanen
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
